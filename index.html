<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Hangout</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: #1e1f22;
            color: #f2f3f5;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gateway-card {
            background-color: #2b2d31;
            border: 1px solid #35373c;
            border-radius: 8px;
            padding: 36px 32px;
            text-align: center;
            width: 340px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        h1 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        p {
            font-size: 13px;
            color: #949ba4;
            margin-bottom: 24px;
            line-height: 1.4;
        }

        .btn-open {
            display: block;
            width: 100%;
            background-color: #5865F2;
            color: white;
            border: none;
            font-size: 15px;
            font-weight: 600;
            padding: 12px 0;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none; /* Asegura el diseño si se usa etiqueta <a> o <button> */
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-open:hover {
            background-color: #4752c4;
        }

        .btn-open:active {
            transform: scale(0.98);
        }

        .direct-link {
            display: inline-block;
            margin-top: 16px;
            font-size: 12px;
            color: #949ba4;
            text-decoration: none;
            transition: color 0.2s;
        }

        .direct-link:hover {
            color: #dbdee1;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="gateway-card">
        <h1>Join!</h1>
        <p>Click below to launch the application.</p>
        
        <!-- El botón principal ahora abre directamente en una nueva pestaña -->
        <button class="btn-open" onclick="openInNewTab()">Open</button>

        <a href="https://dcc-x6ev.onrender.com/" target="_blank" rel="noopener noreferrer" class="direct-link">Open the actual site?</a>
    </div>

    <script>
        function openInNewTab() {
            const targetUrl = 'https://dcc-x6ev.onrender.com/';
            // Abre la pestaña nueva directamente con medidas de seguridad estándar
            const win = window.open(targetUrl, '_blank', 'noopener,noreferrer');
            
            if (!win) {
                alert('Pop-up blocked. Please allow pop-ups or click the link below.');
                return;
            }
            
            win.focus();
        }
    </script>
</body>
</html>
