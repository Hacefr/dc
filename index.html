<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Hangout</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: #1e1f22;
            color: #f2f3f5;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gateway-card {
            background-color: #2b2d31;
            border: 1px solid #35373c;
            border-radius: 8px;
            padding: 36px 32px;
            text-align: center;
            width: 340px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        h1 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        p {
            font-size: 13px;
            color: #949ba4;
            margin-bottom: 24px;
            line-height: 1.4;
        }

        .btn-open {
            display: block;
            width: 100%;
            background-color: #5865F2;
            color: white;
            border: none;
            font-size: 15px;
            font-weight: 600;
            padding: 12px 0;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-open:hover {
            background-color: #4752c4;
        }

        .btn-open:active {
            transform: scale(0.98);
        }

        .direct-link {
            display: inline-block;
            margin-top: 16px;
            font-size: 12px;
            color: #949ba4;
            text-decoration: none;
            transition: color 0.2s;
        }

        .direct-link:hover {
            color: #dbdee1;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="gateway-card">
        <h1>Join!</h1>
        <p>Click below to launch the application.</p>
        
        <!-- Primary button: Launches in an about:blank tab -->
        <button class="btn-open" onclick="openInAboutBlank()">Open</button>

        <!-- Secondary option: Launches the direct live site -->
        <a href="https://dcc-x6ev.onrender.com" class="direct-link">Open the actual site?</a>
    </div>

    <script>
        function openInAboutBlank() {
            const win = window.open('about:blank', '_blank');
            if (!win) {
                alert('Pop-up blocked. Please allow pop-ups or click "Open the actual site?".');
                return;
            }

            const doc = win.document;
            doc.title = 'about:blank';

            const iframe = doc.createElement('iframe');
            iframe.style.position = 'fixed';
            iframe.style.top = '0';
            iframe.style.left = '0';
            iframe.style.width = '100%';
            iframe.style.height = '100%';
            iframe.style.border = 'none';
            iframe.src = 'https://dcc-x6ev.onrender.com';

            doc.body.style.margin = '0';
            doc.body.style.overflow = 'hidden';
            doc.body.appendChild(iframe);
        }
    </script>
</body>
</html>
